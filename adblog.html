    <h1>Add New Blog</h1>

    <form id="blogForm">

        <label>Blog Title</label><br>
        <input type="text" id="title"><br><br>

        <label>Author Name</label><br>
        <input type="text" id="author"><br><br>

        <label>Blog Description</label><br>
        <textarea id="description" rows="6" cols="40"></textarea><br><br>

        <button type="submit">Submit</button>

    </form>

    <hr>

    <footer>
        <p>© 2026 My Blog</p>
    </footer>
